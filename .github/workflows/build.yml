# GitHub Actions: pri každej zmene v repozitári vygeneruje SEO stránky
# a nasadí web na GitHub Pages.
# Denný rebuild (cron): statické stránky sa každé ráno prestavajú z existujúceho
# data.json — expirované Aktuálne/Live This Week udalosti vypadnú a dátum
# v titulkoch sa obnoví aj bez nahrávania nových dát. Verziu dát to NEMENÍ.
# Sitemap lastmod sa pritom NEMENÍ (od 2.10.2026 podľa skutočnej zmeny stránky,
# stav v sitemap-lastmod.json — commitne ho krok „Ulož dátumy zmien pre sitemap").
# EN WEB (bod 6 previerky 2, 4.11.2026): po každom úspešnom nasadení SK webu
# spustí úloha „en-build" build anglického webu (repozitár sportlinks226/sportlinking,
# workflow „Build & Deploy (EN)") — EN web sa odteraz stavia po KAŽDOM SK builde
# z čerstvého data-full.json. Ručné spúšťanie „Build & Deploy (EN)" už netreba.
# Potrebuje secret EN_BUILD_TOKEN (fine-grained token, len repozitár sportlinking,
# právo Actions: Read and write). Bez neho sa EN build nespustí — len varovanie.
# UMIESTNENIE V REPOZITÁRI: .github/workflows/build.yml

name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # denne 23:17 UTC = 0:17 nášho času v zime (1:17 v lete) — tesne po polnoci,
    # neokrúhla minúta (o celej hodine je GitHub preťažený a beh mešká).
    # EN build potom spustí tento SK build sám (úloha en-build nižšie).
    - cron: "17 23 * * *"
  workflow_dispatch:

# Oprávnenia (bod 27 previerky): na úrovni celého workflow len čítanie;
# každá úloha dostane len to, čo naozaj potrebuje (pri úlohe nižšie).
permissions:
  contents: read

# Súbežnosť (bod 18) je nastavená pri ÚLOHÁCH, nie pre celý workflow — rušenie
# na úrovni workflow by zrušilo celý starší beh aj s rozbehnutým nasadením:
#   - build:  skupina pages-build, nový build zruší starší, ktorý ešte len stavia,
#   - deploy: skupina pages-deploy BEZ rušenia — nasadenie sa nikdy nepreruší,
#   - en-build: bez obmedzenia.

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true   # nový build zruší starší, ktorý ešte len stavia
    timeout-minutes: 40   # bod 18: vlajky (max 10) + ikonky (max 15) + generátor a rezerva
    permissions:
      contents: write   # commit sitemap-lastmod.json (dátumy zmien pre sitemap), ikony/ a vlajky/
      pages: read       # configure-pages zisťuje adresu webu (BASE_URL)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # bod 8: vždy najnovší main (commity ikoniek/vlajok/sitemap idú do main)

      - uses: actions/configure-pages@v6
        id: pages

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # VLAJKY KRAJÍN (3.11.2026): vlajky sa sťahujú z flagcdn.com LEN tu, na serveri —
      # návštevník ich načíta z vlastného webu (/vlajky/). vlajky.py stiahne iba
      # CHÝBAJÚCE vlajky (všetky kódy z data.json × veľkosti z appky + 2× pre ostré
      # displeje) do vlajky/ a commitne ich „[skip ci]". Po prvom builde sa už nič
      # nesťahuje, len pri novej krajine. Build kvôli vlajkám NIKDY nespadne
      # (continue-on-error, timeout-minutes, skript vždy končí exit 0); chýbajúcu
      # vlajku generátor nahradí priehľadným obrázkom.
      - name: Stiahni vlajky krajín
        continue-on-error: true
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python vlajky.py --git

      # IKONKY WEBOV (bod 15, 2.11.2026): ikonky sa sťahujú LEN tu, na serveri —
      # návštevník už nič neposiela Googlu ani Yandexu. ikony.py dotiahne nové weby
      # a obnoví LEN ikonky staršie ako 30 dní (max. 300 za build, bod 9), uloží ich do ikony/
      # a PRIEBEŽNE (každé ~3 min) commitne „[skip ci]", aby zrušený build
      # (cancel-in-progress) stiahnuté ikonky nestratil. Limit 12 min — čo nestihne,
      # dotiahne ďalší build. Build kvôli ikonkám NIKDY nespadne (continue-on-error,
      # timeout-minutes, skript vždy končí exit 0).
      - name: Stiahni ikonky webov
        continue-on-error: true
        timeout-minutes: 15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ikony.py --git --limit 720

      - name: Vygeneruj SEO stránky
        run: python generator.py --out _site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}

      # lastmod v sitemape podľa skutočnej zmeny (generator.py, od 2.10.2026):
      # generator zapíše sitemap-lastmod.json; ak sa zmenil, uloží sa do repozitára.
      # „[skip ci]" zabráni, aby tento commit spustil ďalší build. Zlyhanie
      # (napr. súbežný push) deploy NEZASTAVÍ — dátumy sa dorovnajú pri ďalšom builde.
      # Bod 8: keď „git pull --rebase" zlyhá, rebase sa zruší (žiadny polorozbitý
      # stav) a NEpushuje sa — len varovanie v logu.
      - name: Ulož dátumy zmien pre sitemap
        continue-on-error: true
        run: |
          if git status --porcelain -- sitemap-lastmod.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap-lastmod.json
            git commit -m "sitemap: dátumy zmien stránok [skip ci]"
            if git pull --rebase --autostash origin main; then
              git push || echo "::warning::git push sitemap-lastmod.json zlyhal — dorovná sa pri ďalšom builde"
            else
              git rebase --abort || true
              echo "::warning::git pull --rebase zlyhal — rebase zrušený, NEpushujem (dátumy sa dorovnajú pri ďalšom builde)"
            fi
          else
            echo "sitemap-lastmod.json bez zmeny"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # bod 18: vlastná skupina BEZ rušenia — rozbehnuté nasadenie sa nikdy neprekuší,
    # ďalšie počká, kým dobehne.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write      # nasadenie na GitHub Pages
      id-token: write   # overenie nasadenia (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # BOD 6: po úspešnom nasadení SK webu spusti build EN webu (sportlinking).
  # SK build kvôli tomu NIKDY nespadne (continue-on-error, skript končí exit 0).
  en-build:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}   # GITHUB_TOKEN netreba, používa sa EN_BUILD_TOKEN
    steps:
      - name: Spusti Build & Deploy (EN) v sportlinking
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.EN_BUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Chýba secret EN_BUILD_TOKEN — EN build sa nespustil (spusti ho ručne alebo pridaj secret)."
            exit 0
          fi
          # počkaj, kým je nový data-full.json na sportlinky.sk určite dostupný
          sleep 60
          if gh workflow run build.yml --repo sportlinks226/sportlinking --ref main; then
            echo "EN build spustený: https://github.com/sportlinks226/sportlinking/actions"
          else
            echo "::warning::EN build sa nepodarilo spustiť (skontroluj token EN_BUILD_TOKEN) — spusti ho ručne."
          fi
